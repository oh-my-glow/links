    margin:0 auto;
    padding:0 44px 22px;
  }
  nav.boards{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scroll-behavior:smooth;
    padding:6px 0;
    scrollbar-width:thin;
  }
  .board-scroll-btn{
    position:absolute;
    top:6px;
    bottom:22px;
    width:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--cream);
    border:none;
    cursor:pointer;
    font-size:1.2rem;
    color:var(--espresso);
    z-index:2;
  }
  .board-scroll-btn.left{ left:0; }
  .board-scroll-btn.right{ right:0; }
  .board-chip{
    flex:0 0 auto;
    padding:10px 20px;
    border-radius:999px;
    background:var(--champagne);
    font-size:.85rem;
    font-weight:600;
    letter-spacing:.2px;
    cursor:pointer;
    border:2px solid transparent;
    white-space:nowrap;
    transition:transform .15s ease, background .15s ease;
  }
  .board-chip:hover{transform:translateY(-2px);}
  .board-chip.active{
    background:var(--espresso);
    color:var(--cream);
  }

  /* ---------- Pin grid ---------- */
  main{
    max-width:1100px;
    margin:0 auto;
    padding:8px 20px 80px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
  }
  @media(min-width:640px){ .grid{grid-template-columns:repeat(3, 1fr);} }
  @media(min-width:940px){ .grid{grid-template-columns:repeat(4, 1fr);} }

  .pin{
    margin-bottom:0;
    background:#fff;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 2px 10px rgba(58,42,34,.08);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .pin:hover{
    box-shadow:0 10px 26px rgba(58,42,34,.16);
    transform:translateY(-3px);
  }
  .pin img{
    width:100%;
    display:block;
    background:var(--blush);
    aspect-ratio:2/3;
    object-fit:cover;
  }
  .pin-body{padding:14px 14px 16px;}
  .pin-title{
    font-family:'Fraunces', serif;
    font-size:1rem;
    font-weight:500;
    line-height:1.3;
    margin:0 0 12px;
  }
  .shop-btn{

    text-align:center;

    background:var(--rose);
    color:#fff;
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.2px;
    margin-bottom:8px;
    transition:background .15s ease;
  }
  .shop-btn:last-child{margin-bottom:0;}
  .shop-btn:hover{background:var(--rose-dark);}
  .shop-btn.secondary{

const boardNav = document.getElementById("boardNav");
const grid = document.getElementById("grid");
let activeIndex = "all";

function renderBoards(){
  boardNav.innerHTML = "";
  const allChip = document.createElement("div");
  allChip.className = "board-chip" + (activeIndex === "all" ? " active" : "");
  allChip.textContent = "All Pins";
  allChip.onclick = () => { activeIndex = "all"; renderBoards(); renderGrid(); };
  boardNav.appendChild(allChip);

  boards.forEach((board, i) => {
    const chip = document.createElement("div");
    chip.className = "board-chip" + (activeIndex === i ? " active" : "");
    chip.textContent = board.name;
    chip.onclick = () => { activeIndex = i; renderBoards(); renderGrid(); };
    boardNav.appendChild(chip);
  });
}

function renderGrid(){
  grid.innerHTML = "";
  const source = activeIndex === "all"
    ? boards.flatMap(b => b.pins).sort((a, b) => (b.addedOrder || 0) - (a.addedOrder || 0))
    : boards[activeIndex].pins;

  source.forEach(pin => {
    const card = document.createElement("div");
    card.className = "pin";

    const img = document.createElement("img");
    img.src = pin.image;
    img.alt = pin.title;
    img.loading = "lazy";
    card.appendChild(img);

    const body = document.createElement("div");
    body.className = "pin-body";

    const title = document.createElement("p");
    title.className = "pin-title";
    title.textContent = pin.title;
    body.appendChild(title);

    pin.products.forEach((p, idx) => {
      const btn = document.createElement("a");
      btn.className = "shop-btn" + (idx > 0 ? " secondary" : "");
      btn.href = p.url;
      btn.target = "_blank";
      btn.rel = "noopener sponsored";
      btn.textContent = p.label;
      body.appendChild(btn);
    });

    card.appendChild(body);
    grid.appendChild(card);
  });
}

renderBoards();
renderGrid();

// Let the mouse wheel scroll the boards row sideways too
document.getElementById("boardNav").addEventListener("wheel", (e) => {

    document.getElementById("boardNav").scrollLeft += e.deltaY;

}, { passive: false });
