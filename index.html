<style>
  :root{
    --cream:#FBF6F0;
    --champagne:#EFE0C0;
    --blush:#F3DEE1;
    --rose:#B4586A;
    --rose-dark:#8F3F50;
    --caramel:#BE7C42;
    --espresso:#3A2A22;
    --espresso-soft:#6B564C;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--espresso);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  /* ---------- Header ---------- */
  header{
    padding:36px 24px 30px;
    text-align:center;
    position:relative;
    background:#FDE7EC;
  }
  .logo{
    width:150px;
    height:150px;
    object-fit:contain;
    display:block;
    margin:0 auto 6px;
  }
  .logo{
    width:min(220px, 60vw);
    height:auto;
    margin:0 auto 6px;
    display:block;
  }
  header p{
    margin:0;
    color:var(--espresso-soft);
    font-size:.95rem;
    letter-spacing:.4px;
  }

  /* ---------- Board tabs ---------- */
  .boards-wrap{
    position:relative;
    max-width:1100px;
    margin:0 auto;
    padding:0 44px 22px;
  }
  nav.boards{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scroll-behavior:smooth;
    padding:6px 0;
    scrollbar-width:thin;
  }
  .board-scroll-btn{
    position:absolute;
    top:6px;
    bottom:22px;
    width:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--cream);
    border:none;
    cursor:pointer;
    font-size:1.2rem;
    color:var(--espresso);
    z-index:2;
  }
  .board-scroll-btn.left{ left:0; }
  .board-scroll-btn.right{ right:0; }
  .board-chip{
    flex:0 0 auto;
    padding:10px 20px;
    border-radius:999px;
    background:var(--champagne);
    font-size:.85rem;
    font-weight:600;
    letter-spacing:.2px;
    cursor:pointer;
    border:2px solid transparent;
    white-space:nowrap;
    transition:transform .15s ease, background .15s ease;
  }
  .board-chip:hover{transform:translateY(-2px);}
  .board-chip.active{
    background:var(--espresso);
    color:var(--cream);
  }

  /* ---------- Pin grid ---------- */
  main{
    max-width:1100px;
    margin:0 auto;
    padding:8px 20px 80px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
  }
  @media(min-width:640px){ .grid{grid-template-columns:repeat(3, 1fr);} }
  @media(min-width:940px){ .grid{grid-template-columns:repeat(4, 1fr);} }

  .pin{
    margin-bottom:0;
    background:#fff;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 2px 10px rgba(58,42,34,.08);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .pin:hover{
    box-shadow:0 10px 26px rgba(58,42,34,.16);
    transform:translateY(-3px);
  }
  .pin img{
    width:100%;
    display:block;
    background:var(--blush);
    aspect-ratio:2/3;
    object-fit:cover;
  }
  .pin-body{padding:14px 14px 16px;}
  .pin-title{
    font-family:'Fraunces', serif;
    font-size:1rem;
    font-weight:500;
    line-height:1.3;
    margin:0 0 12px;
  }
  .shop-btn{
    display:block;
    width:100%;
    text-align:center;
    padding:10px 12px;
    border-radius:11px;
    background:var(--rose);
    color:#fff;
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.2px;
    margin-bottom:8px;
    transition:background .15s ease;
  }
  .shop-btn:last-child{margin-bottom:0;}
  .shop-btn:hover{background:var(--rose-dark);}
  .shop-btn.secondary{
    background:var(--champagne);
    color:var(--espresso);
  }
  .shop-btn.secondary:hover{background:#e5d3a8;}

  /* ---------- Disclosure & footer ---------- */
  .disclosure{
    max-width:1100px;
    margin:0 auto;
    padding:0 24px 10px;
    font-size:.75rem;
    color:var(--espresso-soft);
    text-align:center;
  }
  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--espresso-soft);
    font-size:.8rem;
  }
  footer a{border-bottom:1px solid var(--caramel);}
</style>

<div class="boards-wrap">
  <button class="board-scroll-btn left" onclick="document.getElementById('boardNav').scrollBy({left:-220,behavior:'smooth'})" aria-label="Scroll boards left">&#8249;</button>
  <nav class="boards" id="boardNav"></nav>
  <button class="board-scroll-btn right" onclick="document.getElementById('boardNav').scrollBy({left:220,behavior:'smooth'})" aria-label="Scroll boards right">&#8250;</button>

<main>

<footer>
  Made with care by Oh, My Glow! · <a href="https://pinterest.com/oohmyglow" target="_blank" rel="noopener">Follow on Pinterest</a>

     button per product — just add more entries to "products".

   payment, no link limits.

   ORDER: each pin has "addedOrder" — a number that just needs to be
   HIGHER than the last one you used. The newest pin (highest number)

/* ========================================================================= */

const boardNav = document.getElementById("boardNav");
const grid = document.getElementById("grid");
let activeIndex = "all";

function renderBoards(){
  boardNav.innerHTML = "";
  const allChip = document.createElement("div");
  allChip.className = "board-chip" + (activeIndex === "all" ? " active" : "");
  allChip.textContent = "All Pins";
  allChip.onclick = () => { activeIndex = "all"; renderBoards(); renderGrid(); };
  boardNav.appendChild(allChip);

  boards.forEach((board, i) => {
    const chip = document.createElement("div");
    chip.className = "board-chip" + (activeIndex === i ? " active" : "");
    chip.textContent = board.name;
    chip.onclick = () => { activeIndex = i; renderBoards(); renderGrid(); };
    boardNav.appendChild(chip);
  });
}

function renderGrid(){
  grid.innerHTML = "";
  const source = activeIndex === "all"
    ? boards.flatMap(b => b.pins).sort((a, b) => (b.addedOrder || 0) - (a.addedOrder || 0))
    : boards[activeIndex].pins;

  source.forEach(pin => {
    const card = document.createElement("div");
    card.className = "pin";

    const img = document.createElement("img");
    img.src = pin.image;
    img.alt = pin.title;
    img.loading = "lazy";
    card.appendChild(img);

    const body = document.createElement("div");
    body.className = "pin-body";

    const title = document.createElement("p");
    title.className = "pin-title";
    title.textContent = pin.title;
    body.appendChild(title);

    pin.products.forEach((p, idx) => {
      const btn = document.createElement("a");
      btn.className = "shop-btn" + (idx > 0 ? " secondary" : "");
      btn.href = p.url;
      btn.target = "_blank";
      btn.rel = "noopener sponsored";
      btn.textContent = p.label;
      body.appendChild(btn);
    });

    card.appendChild(body);
    grid.appendChild(card);
  });
}

renderBoards();
renderGrid();

// Let the mouse wheel scroll the boards row sideways too
document.getElementById("boardNav").addEventListener("wheel", (e) => {
  if (e.deltaY !== 0) {
    e.preventDefault();
    document.getElementById("boardNav").scrollLeft += e.deltaY;
  }
}, { passive: false });
</script>
