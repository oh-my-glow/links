    font-size:.78rem;

    width:100%;

    line-height:1.3;
    margin:22px 0 6px;
    text-align:center;
  }
  .subtitle{
    text-align:center;
    color:var(--espresso-soft);
    font-size:.85rem;
    margin:0 0 26px;
  }

  .shop-btn{
    display:block;
    width:100%;
    text-align:center;
    padding:14px 16px;
    border-radius:12px;
    background:var(--rose);
    color:#fff;
    font-size:.9rem;
    font-weight:600;
    letter-spacing:.2px;
    margin-bottom:10px;
    transition:background .15s ease;
  }
  .shop-btn:hover{background:var(--rose-dark);}
  .shop-btn.secondary{
    background:var(--champagne);
    color:var(--espresso);
  }
  .shop-btn.secondary:hover{background:#e5d3a8;}

  .disclosure{
    text-align:center;
    font-size:.72rem;
    color:var(--espresso-soft);
    margin-top:24px;
  }
