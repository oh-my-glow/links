<style>

    --rose:#B4586A;
    --rose-dark:#8F3F50;
    --caramel:#BE7C42;
    --espresso:#3A2A22;
    --espresso-soft:#6B564C;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--espresso);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  .top-logo{
    display:block;
    width:120px;
    margin:28px auto 0;
  }
  .back-link{
    display:block;
    text-align:center;
    font-size:.78rem;
    color:var(--espresso-soft);
    margin:10px 0 20px;
  }

  main{
    max-width:420px;
    margin:0 auto;
    padding:0 20px 60px;
  }

  .pin-photo{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    border-radius:var(--radius);
    background:var(--blush);
    box-shadow:0 6px 20px rgba(58,42,34,.12);
    display:block;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.4rem;
    line-height:1.3;
    margin:22px 0 6px;
    text-align:center;
  }
  .subtitle{
    text-align:center;
    color:var(--espresso-soft);
    font-size:.85rem;
    margin:0 0 26px;
  }

  .shop-btn{
    display:block;
    width:100%;
    text-align:center;
    padding:14px 16px;
    border-radius:12px;
    background:var(--rose);
    color:#fff;
    font-size:.9rem;
    font-weight:600;
    letter-spacing:.2px;
    margin-bottom:10px;
    transition:background .15s ease;
  }
  .shop-btn:hover{background:var(--rose-dark);}
  .shop-btn.secondary{
    background:var(--champagne);
    color:var(--espresso);
  }
  .shop-btn.secondary:hover{background:#e5d3a8;}

  .disclosure{
    text-align:center;
    font-size:.72rem;
    color:var(--espresso-soft);
    margin-top:24px;
  }
</style>
